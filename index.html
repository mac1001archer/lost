<body>
<main class="game-container">
<header class="game-header"><div class="brand"><span class="brand-icon">♛</span><div><h1>LOST KINGDOM</h1><p>A KING'S JOURNEY</p></div></div><div class="header-buttons"><button id="soundBtn" class="icon-button" aria-label="Toggle sound">♫</button><button id="pauseBtn" class="icon-button" aria-label="Pause game">Ⅱ</button></div></header>
<section class="game-screen"><div class="hud"><div class="hud-item"><span class="hud-label">HEALTH</span><span id="healthDisplay" class="hud-value health">♥ ♥ ♥</span></div><div class="hud-item"><span class="hud-label">COINS</span><span id="coinDisplay" class="hud-value">0</span></div><div class="hud-item"><span class="hud-label">SCORE</span><span id="scoreDisplay" class="hud-value">0000</span></div><div class="hud-item"><span class="hud-label">KEY</span><span id="keyDisplay" class="hud-value">✧ 0/1</span></div></div><canvas id="gameCanvas" width="960" height="540" aria-label="Lost Kingdom platform game"></canvas><div class="world-info"><span id="stageNumber">WORLD 01</span><span id="stageName">THE EMERALD FOREST</span></div><div id="overlay" class="overlay"><div class="overlay-content"><div class="crown">♛</div><p class="overlay-subtitle">LOST KINGDOM</p><h2 id="overlayTitle">THE FALL OF THE KINGDOM</h2><p id="overlayText">The king's journey begins...</p><button id="startBtn" class="start-button">BEGIN ADVENTURE <span>➜</span></button><p class="control-hint">A KING'S JOURNEY</p></div></div><div id="toast" class="toast"></div></section>
<footer class="game-footer"><div class="footer-info"><span>BEST SCORE</span><strong id="bestDisplay">0000</strong></div><div class="controls-info"><span><kbd>A</kbd> <kbd>D</kbd> Move</span><span><kbd>SPACE</kbd> Jump</span><span><kbd>P</kbd> Pause</span></div></footer>
</main>
<script>
// Stage data is declared first to avoid a JavaScript initialization-order error.
const STAGES=[
{name:"EMERALD FOREST",sky:["#75b8c0","#d6d9a4"],ground:"#455b39",accent:"#8ecb82",length:2600,start:[70,380],platforms:[[0,470,580,70],[650,430,210,30],[930,380,180,30],[1180,440,230,30],[1500,390,190,30],[1780,340,210,30],[2070,420,260,30],[2380,470,300,70],[350,370,120,22],[1020,285,110,22],[1620,285,100,22],[2160,330,110,22]],hazards:[{x:500,y:450,w:60,h:20,type:"spikes"},{x:1280,y:420,w:65,h:20,type:"spikes"},{x:1870,y:320,w:55,h:20,type:"spikes"},{x:2110,y:390,w:55,h:30,type:"crystal"}],coins:[[390,330],[710,380],[800,380],[990,330],[1060,235],[1230,390],[1360,390],[1540,340],[1650,235],[1830,290],[1940,290],[2140,370],[2200,280],[2440,420],[2520,420]],key:[1660,235],checkpoint:[1470,345],portal:[2510,390],enemies:[{x:760,y:397,range:80,type:"slime"},{x:1320,y:407,range:70,type:"crawler"},{x:1900,y:250,range:65,type:"bat"},{x:2240,y:387,range:90,type:"slime"}]},
{name:"FORGOTTEN DESERT",sky:["#d99b65","#f3d49a"],ground:"#806044",accent:"#e8bb6f",length:2800,start:[70,380],platforms:[[0,470,430,70],[520,420,190,30],[780,360,160,30],[1010,410,210,30],[1290,350,170,30],[1530,405,180,30],[1780,335,190,30],[2050,390,190,30],[2310,440,250,30],[2640,470,260,70],[300,350,110,22],[850,260,100,22],[1390,250,100,22],[1930,250,100,22],[2400,340,100,22]],hazards:[{x:340,y:450,w:55,h:20,type:"spikes"},{x:1100,y:390,w:70,h:20,type:"spikes"},{x:1610,y:385,w:60,h:20,type:"fire"},{x:2150,y:370,w:60,h:20,type:"spikes"},{x:2450,y:420,w:50,h:25,type:"crystal"}],coins:[[310,310],[570,370],[650,370],[820,310],[890,210],[1070,360],[1160,360],[1340,300],[1430,200],[1570,355],[1660,355],[1820,285],[1950,200],[2100,340],[2200,340],[2380,390],[2460,290],[2680,420],[2780,420]],key:[1950,200],checkpoint:[1750,290],portal:[2760,390],enemies:[{x:600,y:387,range:75,type:"crawler"},{x:1080,y:377,range:80,type:"slime"},{x:1600,y:300,range:70,type:"bat"},{x:2140,y:357,range:80,type:"slime"},{x:2440,y:312,range:70,type:"crawler"}]},
{name:"FROZEN KINGDOM",sky:["#416b91","#b5d9e4"],ground:"#526b7c",accent:"#b7edff",length:3000,start:[70,380],platforms:[[0,470,420,70],[510,415,170,30],[760,345,150,30],[990,405,180,30],[1250,330,170,30],[1500,400,180,30],[1750,320,180,30],[2010,390,180,30],[2260,325,170,30],[2510,420,180,30],[2790,470,300,70],[290,340,110,22],[820,245,100,22],[1320,230,100,22],[1820,225,100,22],[2320,230,100,22],[2580,330,100,22]],hazards:[{x:300,y:450,w:65,h:20,type:"spikes"},{x:1060,y:385,w:65,h:20,type:"crystal"},{x:1580,y:380,w:60,h:20,type:"spikes"},{x:2070,y:370,w:60,h:20,type:"fire"},{x:2570,y:400,w:65,h:20,type:"spikes"}],coins:[[320,300],[550,365],[630,365],[800,295],[870,195],[1040,355],[1130,355],[1290,280],[1370,180],[1550,350],[1640,350],[1800,270],[1870,175],[2050,340],[2140,340],[2300,275],[2370,180],[2550,370],[2630,280],[2840,420],[2930,420]],key:[2370,180],checkpoint:[2220,285],portal:[2910,390],enemies:[{x:590,y:382,range:80,type:"slime"},{x:1080,y:372,range:70,type:"crawler"},{x:1570,y:270,range:75,type:"bat"},{x:2090,y:357,range:80,type:"slime"},{x:2600,y:392,range:75,type:"crawler"}]}
];
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),W=960,H=540,$=id=>document.getElementById(id),GRAVITY=.62,MOVE_SPEED=4.1,JUMP_POWER=12.8;
let stageIndex=0,stage=null,player=null,cameraX=0,coins=[],enemies=[],particles=[],score=0,totalCoins=0,highScore=Number(localStorage.getItem('lostKingdomBest'))||0,gameRunning=false,paused=false,gameOver=false,stageWon=false,portalAnimation=false,soundOn=true,storyMode=false,endingCutscene=false,endingFinished=false,endingTimer=0,defeatCutscene=false,defeatFinished=false,defeatTimer=0,portalTimer=0,portalStartX=0,portalStartY=0,lastTime=0,animationTime=0,toastTimer=null,audioContext=null;
const touchDevice=matchMedia('(pointer: coarse)').matches||navigator.maxTouchPoints>0,input={left:false,right:false,jumpPressed:false},activeTouches=new Map();
const PROLOGUE={title:'THE FALL OF THE KINGDOM',text:'Dahulu kala, sebuah kerajaan hidup dalam kedamaian. Namun, kekuatan jahat menyerang dan merebut istana. Sang raja terpaksa meninggalkan takhtanya. Sekarang, ia harus melewati tiga dunia berbahaya untuk kembali ke kerajaannya.'};
const WORLD_STORIES=[{title:'THE EMERALD FOREST',text:'Setelah kehilangan istananya, sang raja memulai perjalanan melewati Emerald Forest. Hutan ini menyimpan jalan kuno yang dapat membawanya semakin dekat menuju kerajaan.'},{title:'THE FORGOTTEN DESERT',text:'Setelah melewati hutan, sang raja tiba di Forgotten Desert. Di balik padang pasir yang luas, terdapat jalan menuju kerajaan yang telah lama hilang.'},{title:'THE FROZEN KINGDOM',text:'Perjalanan terakhir dimulai. Di balik pegunungan es terdapat jalan menuju istana. Sang raja harus melewati tantangan terakhir sebelum akhirnya pulang.'}];
const makePlayer=(x,y)=>({x,y,w:30,h:43,vx:0,vy:0,hp:3,maxHp:3,jumps:0,facing:1,grounded:false,invincible:0,checkpoint:{x,y},walkTime:0});
function showOverlay(title,text,button,hint=''){ $('overlayTitle').textContent=title;$('overlayText').textContent=text;$('startBtn').innerHTML=button+' <span>➜</span>';$('overlayTitle').classList.remove('victory','defeat');if(/GAME OVER|FALLEN/.test(title))$('overlayTitle').classList.add('defeat');if(/RESTORED|COMPLETED|RETURNED/.test(title))$('overlayTitle').classList.add('victory');$('overlay').classList.remove('hidden');document.querySelector('.control-hint').textContent=hint; }
function showStory(title,text,button='CONTINUE'){storyMode=true;gameRunning=false;paused=false;showOverlay(title,text,button,"LOST KINGDOM — A KING'S JOURNEY")}
function showToast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1500)}
function updateBestScore(){if(score>highScore){highScore=score;try{localStorage.setItem('lostKingdomBest',highScore)}catch(e){}}$('bestDisplay').textContent=String(highScore).padStart(4,'0')}
function updateHUD(){if(!player||!stage)return;$('healthDisplay').textContent='♥ '.repeat(player.hp)+'♡ '.repeat(player.maxHp-player.hp);$('coinDisplay').textContent=totalCoins;$('scoreDisplay').textContent=String(score).padStart(4,'0');$('stageNumber').textContent='WORLD '+String(stageIndex+1).padStart(2,'0');$('stageName').textContent=stage.name;$('keyDisplay').textContent=stage.keyTaken?'✦ 1/1':'✧ 0/1';updateBestScore()}
function loadStage(i){stageIndex=i;stage=STAGES[i];stage.keyTaken=false;stage.checkpointReached=false;stageWon=false;gameOver=false;paused=false;portalAnimation=false;portalTimer=0;player=makePlayer(...stage.start);cameraX=0;particles=[];activeTouches.clear();input.left=input.right=input.jumpPressed=false;coins=stage.coins.map((p,i)=>({x:p[0],y:p[1],collected:false,phase:i*.7}));enemies=stage.enemies.map((e,i)=>({...e,startX:e.x,startY:e.y,w:e.type==='bat'?34:31,h:e.type==='bat'?24:28,dir:i%2?-1:1,speed:e.type==='crawler'?1.35:.8,alive:true,phase:i}));updateHUD()}
function sound(freq=440,duration=.1,type='sine',volume=.06){if(!soundOn)return;try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const o=audioContext.createOscillator(),g=audioContext.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioContext.currentTime);g.gain.setValueAtTime(volume,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+duration)}catch(e){}}
function playEffect(type){const s={coin:[850,1100],damage:[150,90],key:[600,900,1200],enemy:[400,250],portal:[500,750,1000,1300],victory:[600,800,1000,1300,1600]};(s[type]||[440]).forEach((f,i)=>setTimeout(()=>sound(f,.13),i*90))}
const rectHit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function burst(x,y,color,n=8){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*3+1;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.8+Math.random()*.3,maxLife:1.1,size:Math.random()*4+2,color})}}
function updateParticles(dt){for(const p of particles){p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=.08*dt*60;p.life-=dt}particles=particles.filter(p=>p.life>0)}
function damagePlayer(){if(player.invincible>0||gameOver||portalAnimation||endingCutscene||defeatCutscene)return;player.hp--;player.invincible=1.4;player.vy=-7;player.vx=-player.facing*4;playEffect('damage');burst(player.x+15,player.y+20,'#ff7b76',12);if(player.hp<=0){gameRunning=false;paused=false;gameOver=true;defeatCutscene=true;defeatFinished=false;defeatTimer=0;activeTouches.clear();input.left=input.right=input.jumpPressed=false;updateBestScore()}updateHUD()}
function respawn(){if(gameOver||defeatCutscene)return;player.x=player.checkpoint.x;player.y=player.checkpoint.y;player.vx=player.vy=0;player.jumps=0}
function jump(){if(!gameRunning||paused||gameOver||stageWon||portalAnimation||endingCutscene||defeatCutscene)return;if(player.jumps<2){player.vy=player.jumps===0?-JUMP_POWER:-JUMP_POWER*.88;player.jumps++;player.grounded=false;burst(player.x+15,player.y+43,'#d8e8d4',5);sound(player.jumps===1?370:520,.1)}}
function updatePlayer(dt){const p=player,s=MOVE_SPEED*(stageIndex===2?.94:1);if(input.left){p.vx=-s;p.facing=-1}else if(input.right){p.vx=s;p.facing=1}else p.vx*=.78;p.x=Math.max(0,Math.min(p.x+p.vx,stage.length-p.w));p.vy=Math.min(p.vy+GRAVITY,14);p.y+=p.vy;p.grounded=false;for(const q of stage.platforms){const b={x:q[0],y:q[1],w:q[2],h:q[3]};if(!rectHit(p,b))continue;if(p.vy>=0&&p.y+p.h-p.vy<=b.y+8){p.y=b.y-p.h;p.vy=0;p.grounded=true;p.jumps=0}else if(p.vy<0&&p.y-p.vy>=b.y+b.h-5){p.y=b.y+b.h;p.vy=0}else if(p.vx>0)p.x=b.x-p.w;else if(p.vx<0)p.x=b.x+b.w}if(p.grounded&&Math.abs(p.vx)>.5)p.walkTime+=dt*12;if(p.invincible>0)p.invincible-=dt;if(input.jumpPressed){jump();input.jumpPressed=false}if(p.y>H+100){damagePlayer();if(!gameOver)respawn()}}
function updateCoins(){for(const c of coins){if(c.collected)continue;if(rectHit(player,{x:c.x-10,y:c.y-10,w:20,h:20})){c.collected=true;totalCoins++;score+=100;playEffect('coin');burst(c.x,c.y,'#ffe18b',10);updateHUD()}}if(!stage.keyTaken&&rectHit(player,{x:stage.key[0]-11,y:stage.key[1]-13,w:22,h:26})){stage.keyTaken=true;score+=300;playEffect('key');burst(stage.key[0],stage.key[1],'#fff0a0',18);showToast('ANCIENT KEY ACQUIRED!');updateHUD()}}
function updateEnemies(dt){for(const e of enemies){if(!e.alive)continue;e.phase+=dt;if(e.type==='bat'){e.x+=e.dir*1.3;e.y=e.startY+Math.sin(e.phase*4)*24}else{e.x+=e.dir*e.speed;if(e.type==='slime')e.y=e.startY+Math.abs(Math.sin(e.phase*5))*5}if(e.x>e.startX+e.range)e.dir=-1;if(e.x<e.startX-e.range)e.dir=1;if(rectHit(player,e)){if(player.vy>0&&player.y+player.h-e.y<17){e.alive=false;player.vy=-8.5;player.jumps=1;score+=200;playEffect('enemy');burst(e.x+15,e.y+10,'#b4e5a0',13);showToast('ENEMY DEFEATED!');updateHUD()}else{damagePlayer();if(!gameOver)respawn()}}}}
function updateHazards(){for(const h of stage.hazards)if(rectHit(player,h)){damagePlayer();if(!gameOver)respawn();break}}
function updateCheckpoint(){const c=stage.checkpoint;if(!stage.checkpointReached&&rectHit(player,{x:c[0],y:c[1],w:35,h:60})){stage.checkpointReached=true;player.checkpoint={x:c[0],y:c[1]-45};showToast('CHECKPOINT ACTIVATED!');sound(620,.15)}}
function beginPortalAnimation(){if(portalAnimation||stageWon||gameOver)return;portalAnimation=true;gameRunning=false;portalTimer=0;portalStartX=player.x;portalStartY=player.y;playEffect('portal');burst(player.x+15,player.y+20,'#ffe8a3',25)}
function updatePortalAnimation(dt){if(!portalAnimation)return;portalTimer+=dt;const t=Math.min(portalTimer/.9,1);player.x=portalStartX+(stage.portal[0]-5-portalStartX)*t;player.y=portalStartY+(stage.portal[1]-35-portalStartY)*t;if(t>=1){portalAnimation=false;finishStage()}}
function finishStage(){score+=500;updateHUD();playEffect('victory');if(stageIndex<STAGES.length-1){stageWon=true;gameRunning=false;showOverlay('WORLD COMPLETED!','Kamu berhasil menyelesaikan '+stage.name+'! Bonus portal +500 poin. Perjalanan sang raja masih berlanjut.','NEXT WORLD','A new chapter awaits...')}else{gameRunning=false;endingCutscene=true;endingFinished=false;endingTimer=0;$('overlay').classList.add('hidden')}updateBestScore()}
function updatePortal(){if(!rectHit(player,{x:stage.portal[0]-20,y:stage.portal[1]-60,w:55,h:70}))return;if(!stage.keyTaken){showToast('FIND THE ANCIENT KEY FIRST!');return}beginPortalAnimation()}
function drawHazards(){for(const h of stage.hazards){const x=h.x-cameraX,y=h.y;if(x+h.w<0||x>W)continue;if(h.type==='fire'){ctx.fillStyle='#6c271c';ctx.fillRect(x,y+10,h.w,10);for(let i=0;i<h.w;i+=17){const f=Math.sin(animationTime*12+i)*4;ctx.fillStyle='#e84e24';ctx.beginPath();ctx.moveTo(x+i,y+20);ctx.quadraticCurveTo(x+i+7,y-8-f,x+i+14,y+20);ctx.fill();ctx.fillStyle='#ffd36b';ctx.beginPath();ctx.moveTo(x+i+5,y+20);ctx.lineTo(x+i+8,y+5-f);ctx.lineTo(x+i+11,y+20);ctx.fill()}}else{for(let i=0;i<h.w;i+=16){ctx.fillStyle=h.type==='crystal'?'#294c65':stageIndex===2?'#344b5c':'#354238';ctx.strokeStyle='#142331';ctx.beginPath();ctx.moveTo(x+i,y+h.h);ctx.lineTo(x+i+8,y);ctx.lineTo(x+i+16,y+h.h);ctx.closePath();ctx.fill();ctx.stroke()}}}}
function drawCheckpoint(){const c=stage.checkpoint,x=c[0]-cameraX;ctx.fillStyle='#4b3930';ctx.fillRect(x,c[1]-42,5,43);ctx.fillStyle=stage.checkpointReached?'#ffe28b':'#aab8b6';ctx.beginPath();ctx.moveTo(x+5,c[1]-42);ctx.lineTo(x+34,c[1]-32);ctx.lineTo(x+5,c[1]-19);ctx.closePath();ctx.fill()}
function drawPortal(){const x=stage.portal[0]-cameraX,y=stage.portal[1],ok=stage.keyTaken;ctx.save();ctx.translate(x,y);ctx.scale(1+Math.sin(animationTime*3)*.05,1+Math.sin(animationTime*3)*.05);ctx.shadowBlur=ok?28:10;ctx.shadowColor=ok?'#f5d48c':'#77909b';ctx.fillStyle='#292d36';ctx.beginPath();ctx.roundRect(-22,-58,48,70,24);ctx.fill();const g=ctx.createLinearGradient(-15,-55,15,5);g.addColorStop(0,ok?'#ffe8a7':'#6e8798');g.addColorStop(.5,ok?'#aa78c9':'#344f69');g.addColorStop(1,ok?'#553d7a':'#1a293c');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(2,-24,17,29,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#d5b477';ctx.lineWidth=5;ctx.beginPath();ctx.roundRect(-22,-58,48,70,24);ctx.stroke();ctx.restore();ctx.fillStyle='#fff1ce';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText(ok?'ENTER':'LOCKED',x+2,y+28)}
function drawSky(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,stage.sky[0]);g.addColorStop(1,stage.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const sx=770-cameraX*.08;ctx.fillStyle='#ffedb83d';ctx.beginPath();ctx.arc(sx,110,62,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffefc1cc';ctx.beginPath();ctx.arc(sx,110,27,0,Math.PI*2);ctx.fill();for(let i=0;i<8;i++){const x=i*190-(cameraX*.18%190)-50,h=100+(i%3)*35;ctx.fillStyle=stageIndex===2?'#526d85':stageIndex===1?'#bd8659':'#557b6c';ctx.beginPath();ctx.moveTo(x,360);ctx.lineTo(x+100,360-h);ctx.lineTo(x+205,360);ctx.closePath();ctx.fill()}}
function drawBackgroundDecor(){const off=cameraX*.48;for(let i=0;i<18;i++){const x=((i*180-off)%1250+1250)%1250-100,y=470;if(stageIndex===0){ctx.fillStyle='#315c48';ctx.fillRect(x+10,y-105,12,105);ctx.fillStyle='#36775a';ctx.beginPath();ctx.arc(x+15,y-110,37,0,Math.PI*2);ctx.fill()}else if(stageIndex===1){ctx.fillStyle='#9b6845';ctx.fillRect(x+20,y-95,15,95);ctx.fillStyle='#4f8a57';ctx.fillRect(x+3,y-110,50,15);ctx.fillRect(x+13,y-130,13,40)}else{ctx.fillStyle='#d4edf0';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+32,y-100);ctx.lineTo(x+66,y);ctx.fill()}}}
function drawPlatform(p){const[x,y,w,h]=p,s=x-cameraX;if(s+w<-50||s>W+50)return;ctx.fillStyle=stage.ground;ctx.fillRect(s,y,w,h);ctx.fillStyle=stage.accent;ctx.fillRect(s,y,w,7);ctx.fillStyle='#00000026';ctx.fillRect(s,y+8,w,4);for(let i=0;i<w;i+=35){ctx.fillStyle='#ffffff12';ctx.fillRect(s+i+8,y+17,15,3)}}
function drawCoins(){for(const c of coins){if(c.collected)continue;const x=c.x-cameraX,y=c.y+Math.sin(animationTime*3+c.phase)*4;if(x<-30||x>W+30)continue;ctx.fillStyle='#8b632b';ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffe29a';ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#bd8b3e';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText('✦',x,y+4)}}
function drawKey(){if(stage.keyTaken)return;const x=stage.key[0]-cameraX,y=stage.key[1]+Math.sin(animationTime*3)*5;ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(animationTime*2)*.15);ctx.shadowBlur=18;ctx.shadowColor='#ffe58d';ctx.strokeStyle='#ffe5a0';ctx.lineWidth=5;ctx.beginPath();ctx.arc(-5,-5,8,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(3,0);ctx.lineTo(18,15);ctx.lineTo(13,20);ctx.moveTo(10,12);ctx.lineTo(5,17);ctx.stroke();ctx.restore()}
function drawEnemies(){for(const e of enemies){if(!e.alive)continue;const x=e.x-cameraX,y=e.y;if(x<-50||x>W+50)continue;if(e.type==='bat'){ctx.fillStyle='#45365d';ctx.beginPath();ctx.moveTo(x+15,y+12);ctx.lineTo(x-5,y+2+Math.sin(animationTime*14)*10);ctx.lineTo(x+3,y+25);ctx.lineTo(x+15,y+17);ctx.lineTo(x+27,y+25);ctx.lineTo(x+35,y+2);ctx.closePath();ctx.fill();ctx.fillStyle='#ffdf8c';ctx.fillRect(x+9,y+9,3,3);ctx.fillRect(x+19,y+9,3,3)}else{ctx.fillStyle=e.type==='crawler'?'#49352b':'#263e30';ctx.beginPath();ctx.ellipse(x+15,y+15,16,11,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=stageIndex===2?'#b9e6ee':stageIndex===1?'#c18b55':'#8bbd72';ctx.beginPath();ctx.ellipse(x+15,y+12,14,12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff0b0';ctx.fillRect(x+8,y+7,4,5);ctx.fillRect(x+19,y+7,4,5)}}}
function drawPlayer(){const p=player;if(p.invincible>0&&Math.floor(animationTime*15)%2===0)return;const x=p.x-cameraX,y=p.y,walk=p.grounded&&Math.abs(p.vx)>.5,sw=walk?Math.sin(p.walkTime)*5:0;ctx.save();ctx.translate(x+p.w/2,y);ctx.scale(p.facing,1);ctx.fillStyle='#00000038';ctx.beginPath();ctx.ellipse(0,44,17,4,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#743d39';ctx.beginPath();ctx.moveTo(-7,15);ctx.lineTo(-19,38+sw*.3);ctx.lineTo(2,34);ctx.lineTo(8,15);ctx.fill();ctx.fillStyle='#293748';ctx.fillRect(-9,29+sw*.4,8,12);ctx.fillRect(2,29-sw*.4,8,12);ctx.fillStyle='#49342b';ctx.fillRect(-11,39+sw*.4,11,5);ctx.fillRect(1,39-sw*.4,11,5);ctx.fillStyle='#385c66';ctx.fillRect(-11,14,22,19);ctx.fillStyle='#c59b62';ctx.fillRect(-3,15,7,17);ctx.fillStyle='#dba77d';ctx.beginPath();ctx.arc(0,9,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4a302b';ctx.beginPath();ctx.arc(0,5,10,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(-10,5,5,7);ctx.fillStyle='#e5bf78';ctx.fillRect(-11,0,22,3);ctx.fillStyle='#f5d17e';ctx.beginPath();ctx.moveTo(-10,1);ctx.lineTo(-9,-9);ctx.lineTo(-3,-3);ctx.lineTo(0,-12);ctx.lineTo(4,-3);ctx.lineTo(10,-9);ctx.lineTo(10,1);ctx.fill();ctx.fillStyle='#d7e2df';ctx.fillRect(11,20,3,14);ctx.fillStyle='#8d6744';ctx.fillRect(9,30,7,3);ctx.restore()}
function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.maxLife);ctx.fillStyle=p.color;ctx.fillRect(p.x-cameraX,p.y,p.size,p.size)}ctx.globalAlpha=1}
function drawWorldTitle(){if(animationTime>4)return;ctx.save();ctx.globalAlpha=Math.max(0,1-animationTime/4);ctx.fillStyle='#0c141a8c';ctx.fillRect(0,205,W,90);ctx.fillStyle='#f8d99b';ctx.font='bold 12px Georgia';ctx.textAlign='center';ctx.fillText('WORLD '+String(stageIndex+1).padStart(2,'0'),W/2,235);ctx.font='bold 27px Georgia';ctx.fillText(stage.name,W/2,270);ctx.restore()}
function drawEndingKing(x,y,sitting=false){ctx.save();ctx.translate(x,y);ctx.fillStyle='#743d39';ctx.beginPath();if(sitting){ctx.moveTo(-13,15);ctx.lineTo(-35,44);ctx.lineTo(35,44);ctx.lineTo(13,15)}else{ctx.moveTo(-8,15);ctx.lineTo(-19,39);ctx.lineTo(18,39);ctx.lineTo(8,15)}ctx.closePath();ctx.fill();ctx.fillStyle='#385c66';ctx.fillRect(-11,10,22,25);ctx.fillStyle='#dba77d';ctx.beginPath();ctx.arc(0,5,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f5d17e';ctx.beginPath();ctx.moveTo(-10,-4);ctx.lineTo(-9,-15);ctx.lineTo(-3,-8);ctx.lineTo(2,-17);ctx.lineTo(7,-8);ctx.lineTo(11,-15);ctx.lineTo(10,-4);ctx.fill();if(!sitting){ctx.fillStyle='#293748';ctx.fillRect(-9,34,7,10);ctx.fillRect(3,34,7,10)}ctx.restore()}
function drawEndingScene(){const t=endingTimer;if(t<10){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#172d48');g.addColorStop(.55,'#986b69');g.addColorStop(1,'#f2c58b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#354c39';ctx.fillRect(0,420,W,120);ctx.fillStyle='#333c4a';ctx.fillRect(520,205,360,220);ctx.fillRect(490,155,80,270);ctx.fillRect(830,155,80,270);ctx.fillStyle='#9a6b54';ctx.beginPath();ctx.moveTo(550,205);ctx.lineTo(700,105);ctx.lineTo(840,205);ctx.fill();drawEndingKing(100+Math.min(t/7,1)*565,375+Math.sin(t*12)*2);ctx.fillStyle='#080f19a6';ctx.fillRect(0,15,W,70);ctx.textAlign='center';ctx.fillStyle='#ffe5b2';ctx.font='bold 22px Georgia';ctx.fillText(t<3?'THE KINGDOM AWAITS ITS KING':t<7?'THE KING HAS COME HOME':'WELCOME HOME, YOUR MAJESTY',W/2,58)}else{const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#172333');g.addColorStop(1,'#49332d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#806044';ctx.fillRect(0,430,W,110);for(const x of [100,250,710,860]){ctx.fillStyle='#56606a';ctx.fillRect(x,80,35,350)}ctx.fillStyle='#a87937';ctx.fillRect(410,270,140,160);ctx.fillStyle='#713b3d';ctx.fillRect(425,265,110,155);drawEndingKing(480,310,true);ctx.textAlign='center';ctx.fillStyle='#ffe5b2';ctx.font='bold 23px Georgia';ctx.fillText('THE KING HAS RETURNED',W/2,490)}}
function updateEnding(dt){endingTimer+=dt;if(endingTimer>=15&&!endingFinished){endingFinished=true;endingCutscene=false;gameOver=true;updateBestScore();showOverlay('THE KING HAS RETURNED','After a long journey, the king has finally returned to his castle. His kingdom is restored, and peace has returned to the land. Total coins: '+totalCoins+'. Final score: '+score+'. Best score: '+highScore+'.','PLAY AGAIN','THE END — LONG LIVE THE KING!');playEffect('victory')}}
function drawDefeatScene(){const t=defeatTimer,g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#090e1c');g.addColorStop(.65,'#252333');g.addColorStop(1,'#49313a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#9b5058';ctx.beginPath();ctx.arc(760,120,35,0,Math.PI*2);ctx.fill();ctx.fillStyle='#171a29';ctx.beginPath();ctx.moveTo(0,350);ctx.lineTo(180,160);ctx.lineTo(350,350);ctx.lineTo(550,190);ctx.lineTo(760,350);ctx.lineTo(960,180);ctx.lineTo(960,540);ctx.lineTo(0,540);ctx.fill();ctx.fillStyle='#111522';ctx.fillRect(530,230,330,200);ctx.fillRect(490,170,75,260);ctx.fillRect(825,170,75,260);ctx.fillStyle='#a33c49';for(const x of [515,850,620,760])ctx.fillRect(x,250,20,38);ctx.fillStyle='#542f3a';ctx.beginPath();ctx.moveTo(285,365);ctx.lineTo(245,445);ctx.lineTo(350,445);ctx.lineTo(315,365);ctx.fill();ctx.textAlign='center';ctx.fillStyle='#d9a0a0';ctx.font='bold 23px Georgia';ctx.fillText(t<2?"THE KING'S JOURNEY ENDS":t<4?'DARKNESS HAS CLAIMED THE KINGDOM':'THE KINGDOM HAS FALLEN',W/2,65);if(t>4.5){const a=Math.min((t-4.5)/1.5,1);ctx.fillStyle=`rgba(0,0,0,${a*.85})`;ctx.fillRect(0,0,W,H);ctx.globalAlpha=a;ctx.fillStyle='#c47a80';ctx.font='bold 32px Georgia';ctx.fillText('THE KINGDOM HAS FALLEN',W/2,265);ctx.globalAlpha=1}}
function updateDefeat(dt){defeatTimer+=dt;if(defeatTimer>=6&&!defeatFinished){defeatFinished=true;defeatCutscene=false;gameOver=true;updateBestScore();showOverlay('THE KINGDOM HAS FALLEN','The king could not complete his journey. The kingdom remains under the control of darkness. But the story does not have to end here. Final score: '+score+'. Best score: '+highScore+'.','TRY AGAIN','A king never gives up on his kingdom.')}}
function update(dt){if(endingCutscene){updateEnding(dt);return}if(defeatCutscene){updateDefeat(dt);return}if(portalAnimation){updatePortalAnimation(dt);updateParticles(dt);return}if(!gameRunning||paused)return;animationTime+=dt;updatePlayer(dt);if(!gameRunning){updateParticles(dt);return}updateCoins();updateEnemies(dt);if(gameOver){updateParticles(dt);return}updateHazards();if(gameOver){updateParticles(dt);return}updateCheckpoint();updatePortal();updateParticles(dt);const target=player.x-W*.38;cameraX+=(target-cameraX)*.09;cameraX=Math.max(0,Math.min(cameraX,stage.length-W));updateHUD()}
function render(){if(endingCutscene){drawEndingScene();return}if(defeatCutscene){drawDefeatScene();return}if(!stage||!player)return;ctx.clearRect(0,0,W,H);drawSky();drawBackgroundDecor();stage.platforms.forEach(drawPlatform);drawHazards();drawCheckpoint();drawCoins();drawKey();drawPortal();drawEnemies();drawPlayer();drawParticles();drawWorldTitle();const v=ctx.createRadialGradient(W/2,H/2,100,W/2,H/2,650);v.addColorStop(0,'#00000000');v.addColorStop(1,'#0000002e');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);drawVirtualControls()}
function canvasPos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function updateTouch(){input.left=false;input.right=false;for(const c of activeTouches.values()){if(c==='left')input.left=true;if(c==='right')input.right=true}}
function drawControl(x,y,label,active){ctx.save();ctx.globalAlpha=active?.8:.43;ctx.fillStyle=active?'#e9c47e':'#14242d';ctx.strokeStyle='#ffe3a5';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x,y,68,62,15);ctx.fill();ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle=active?'#26333b':'#fff0ce';ctx.font='bold 25px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x+34,y+31);ctx.restore()}
function drawVirtualControls(){if(!touchDevice||!gameRunning||paused)return;drawControl(22,H-88,'◀',input.left);drawControl(101,H-88,'▶',input.right);drawControl(W-91,H-88,'↑',false);ctx.fillStyle='#ffe5b2';ctx.font='bold 9px Arial';ctx.textAlign='center';ctx.fillText('JUMP',W-57,H-13)}
canvas.addEventListener('pointerdown',e=>{if(!touchDevice||!gameRunning||paused)return;e.preventDefault();const p=canvasPos(e);if(p.y>H-115&&p.x<190)activeTouches.set(e.pointerId,p.x<95?'left':'right');else if(p.y>H-155&&p.x>W-190){activeTouches.set(e.pointerId,'jump');input.jumpPressed=true}updateTouch()});['pointerup','pointercancel'].forEach(ev=>canvas.addEventListener(ev,e=>{activeTouches.delete(e.pointerId);updateTouch()}));canvas.addEventListener('contextmenu',e=>e.preventDefault());
function keyDown(e){const k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup',' '].includes(k))e.preventDefault();if(k==='a'||k==='arrowleft')input.left=true;if(k==='d'||k==='arrowright')input.right=true;if((k===' '||k==='w'||k==='arrowup')&&!e.repeat)input.jumpPressed=true;if(k==='p'&&!e.repeat)pauseGame()}
function keyUp(e){const k=e.key.toLowerCase();if(k==='a'||k==='arrowleft')input.left=false;if(k==='d'||k==='arrowright')input.right=false}window.addEventListener('keydown',keyDown);window.addEventListener('keyup',keyUp);window.addEventListener('blur',()=>{input.left=input.right=false;activeTouches.clear()});
function startGame(){storyMode=false;gameRunning=true;paused=false;$('overlay').classList.add('hidden');$('pauseBtn').textContent='Ⅱ';lastTime=performance.now()}
function pauseGame(){if(!gameRunning||gameOver||stageWon||portalAnimation||endingCutscene||defeatCutscene||storyMode)return;paused=true;gameRunning=false;$('pauseBtn').textContent='▶';showOverlay('PAUSED','Petualangan sedang dijeda. Siap melanjutkan perjalanan?','RESUME','Tekan tombol untuk melanjutkan.')}
$('startBtn').addEventListener('click',()=>{if(storyMode){startGame();return}if(stageWon&&stageIndex<STAGES.length-1){const n=stageIndex+1;loadStage(n);animationTime=0;showStory(WORLD_STORIES[n].title,WORLD_STORIES[n].text,'BEGIN JOURNEY');return}if(gameOver){score=0;totalCoins=0;gameOver=stageWon=paused=false;endingCutscene=endingFinished=false;endingTimer=0;defeatCutscene=defeatFinished=false;defeatTimer=0;loadStage(0);animationTime=0;showStory(PROLOGUE.title,PROLOGUE.text,'BEGIN ADVENTURE');return}if(paused){paused=false;startGame()}});
$('pauseBtn').addEventListener('click',pauseGame);$('soundBtn').addEventListener('click',()=>{soundOn=!soundOn;$('soundBtn').textContent=soundOn?'♫':'♪';showToast(soundOn?'SOUND ON':'SOUND OFF')});
function loop(time){const dt=Math.min((time-lastTime)/1000||0,.033);lastTime=time;update(dt);render();requestAnimationFrame(loop)}
loadStage(0);updateBestScore();showStory(PROLOGUE.title,PROLOGUE.text,'BEGIN ADVENTURE');render();lastTime=performance.now();requestAnimationFrame(loop);
</script>
</body></html>
